
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>ÈLAN & CO. | Under Maintenance</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      color: #102957;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 22px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      text-align: center;
    }

    .logo {
      margin-bottom: 90px;
    }

    .logo-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(42px, 9vw, 92px);
      font-weight: normal;
      letter-spacing: -3px;
      white-space: nowrap;
    }

    .trademark {
      display: inline-block;
      font-family: Arial, sans-serif;
      font-size: 14px;
      vertical-align: top;
      margin-top: 5px;
      letter-spacing: 0;
    }

    .tagline {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-top: 16px;
      font-size: clamp(10px, 2vw, 19px);
      font-weight: bold;
      letter-spacing: 3px;
      white-space: nowrap;
    }

    .tagline::before,
    .tagline::after {
      content: "";
      display: block;
      width: 55px;
      height: 2px;
      background: #102957;
    }

    h1 {
      font-size: clamp(29px, 5.5vw, 48px);
      line-height: 1.3;
      margin: 0 0 28px;
      font-weight: 700;
    }

    .message {
      color: #34445f;
      font-size: clamp(18px, 3.8vw, 35px);
      line-height: 1.65;
      margin: 0;
    }

    .contact {
      margin-top: 62px;
      color: #34445f;
      font-size: clamp(17px, 3.5vw, 31px);
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .contact a {
      color: #102957;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @media (max-width: 480px) {
      .logo {
        margin-bottom: 65px;
      }

      .logo-name {
        letter-spacing: -2px;
      }

      .tagline {
        gap: 9px;
        letter-spacing: 1.5px;
      }

      .tagline::before,
      .tagline::after {
        width: 25px;
      }

      h1 {
        margin-bottom: 25px;
      }

      .message br {
        display: none;
      }

      .contact {
        margin-top: 52px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="logo">
      <div class="logo-name">
        ÈLAN &amp; CO.<span class="trademark">™</span>
      </div>

      <div class="tagline">
        EUROPEAN CERTIFIED COMPANY
      </div>
    </header>

    <section>
      <h1>
        Our website is under<br>
        maintenance
      </h1>

      <p class="message">
        We will be back online soon. Until then, you<br>
        can reach us:
      </p>

     
<div class="contact">

</a>

      
  </div>
</div>

</body>
</html>
